name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  godot-import:
    name: Godot project loads (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned Godot version matches .godot-version
        run: |
          test "$(cat .godot-version)" = "$GODOT_VERSION"

      - name: Download Godot (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --import'

      - name: Run main scene for a few frames
        run: '"$GODOT" --headless --path . --quit-after 3'

      # -c keeps going after a failure; GdUnit4 stops a suite at the first failure by default,
      # which would hide every later failure behind the first one.
      - name: Run GdUnit4 suites
        run: GODOT_BIN="$GODOT" ./addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -c -a res://tests

      # Godot exports 10,000 seeded problems per built generator as JSON lines and the Python
      # checkers (tools/crosscheck/checkers/, which share no code with the generators)
      # recompute every answer and distractor from that JSON. Exit code 3 means Godot has not
      # built the project yet, so it must come after the import step above.
      - name: Cross-check problem generators in Python
        run: python3 tools/crosscheck/run.py --all --n 10000

      # Hint rung 4 swaps in easier problems (difficulty -1 and -2); peer review 02, section 4.6.
      - name: Cross-check the easier hint-rung problems (difficulty -1 and -2)
        run: |
          python3 tools/crosscheck/run.py --all --n 2000 --difficulty -1
          python3 tools/crosscheck/run.py --all --n 2000 --difficulty -2

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: ignore

      # The release-signed AAB for the internal testing track stays a local Friday step: it
      # needs the upload keystore, which never leaves Spiro's machine.

  python:
    name: Python tools, content lint and curriculum checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install -r tools/requirements.txt

      - name: pytest (curriculum, lint rules, export permissions, screens and target SDK, manifest check)
        run: python3 -m pytest tools -q

      - name: Content lint (hard-coded text, text fields, banned words, text table, curriculum)
        run: python3 tools/ci/lint_content.py

      - name: Static performance checks (no per-frame allocations, OGG audio, size budget)
        run: python3 tools/ci/perf_check.py

  # P1-S11-04: a debug APK on every merge to main (and on demand), for adb installs on the
  # devices. It uses a throwaway debug keystore made here, so nothing secret is involved.
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: godot-import
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and its export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d templates_unzipped
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATE_DIR"
          mv templates_unzipped/templates/* "$TEMPLATE_DIR/"
          rm -rf godot.zip templates.tpz templates_unzipped

      - name: Android SDK packages for target SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Throwaway debug keystore and editor settings (SDK, JDK, keystore paths)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import the project
        run: '"$GODOT" --headless --path . --import'

      # --install-android-build-template only works together with an export flag; it puts the
      # Gradle build template in android/build (gitignored) before the export uses it.
      # Godot 4.7.2 can abort while shutting down after that export (its file-system scan of the
      # new template is cut short, exit 134), when the APK is already written. So the exit code
      # is reported, not trusted: the APK itself is checked here and in the next step.
      - name: Install the Gradle build template and export the debug APK
        run: |
          mkdir -p build
          status=0
          "$GODOT" --headless --path . --install-android-build-template --export-debug "Android" build/gem-mines-debug.apk || status=$?
          echo "Godot exited with status $status"
          test -s build/gem-mines-debug.apk
          unzip -l build/gem-mines-debug.apk | grep -q "classes.dex"

      # CLAUDE.md rule 1: the app never asks for the network. The preset test checks the
      # setting; this checks the APK that was actually built.
      - name: The APK asks for no INTERNET permission
        run: |
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT2" dump permissions build/gem-mines-debug.apk > permissions.txt
          cat permissions.txt
          grep -q "com.spiroganas.gemmine" permissions.txt # aapt2 really read the APK
          ! grep -q "android.permission.INTERNET" permissions.txt

      # P3-S24-06 / P3-S25-05: the full manifest check on the APK that was built: no banned
      # permission (INTERNET, location, camera, microphone, contacts, advertising ID) and phones
      # excluded (<supports-screens> small and normal false). aapt2 cross-checks its AXML reader.
      - name: Manifest check (banned permissions, phones excluded)
        run: AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" python3 tools/ci/check_manifest.py build/gem-mines-debug.apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gem-mines-debug-apk
          path: build/gem-mines-debug.apk
          retention-days: 30
