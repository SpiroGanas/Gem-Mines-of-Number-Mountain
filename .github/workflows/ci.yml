name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  godot-import:
    name: Godot project loads (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned Godot version matches .godot-version
        run: |
          test "$(cat .godot-version)" = "$GODOT_VERSION"

      - name: Download Godot (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --import'

      - name: Run main scene for a few frames
        run: '"$GODOT" --headless --path . --quit-after 3'

      # -c keeps going after a failure; GdUnit4 stops a suite at the first failure by default,
      # which would hide every later failure behind the first one.
      - name: Run GdUnit4 suites
        run: GODOT_BIN="$GODOT" ./addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -c -a res://tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: ignore

      # Phase 1, Sprint 11 adds: Friday Android build to the internal testing track.

  python:
    name: Python tools, content lint and curriculum checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install -r tools/requirements.txt

      - name: pytest (curriculum, lint rules, export permissions)
        run: python3 -m pytest tools -q

      - name: Content lint (hard-coded text, text fields, banned words, text table, curriculum)
        run: python3 tools/ci/lint_content.py
