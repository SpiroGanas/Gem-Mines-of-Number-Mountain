<?xml version="1.0" encoding="UTF-8"?>
<!-- Gem Mines of Number Mountain: Play Store icon source (512 x 512). Code-drawn, no outside art.
     Bolt's electric headlamp (top left) lights a faceted amethyst. Colours from scenes/mine/gem_art.gd
     and scenes/shell/backdrop.gd. Render with marketing/render.sh. No text (it would not survive the
     launcher's small sizes). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34406A"/>
      <stop offset="1" stop-color="#1F2945"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B98AE8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#B98AE8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cave)"/>
  <!-- rock ledge -->
  <path d="M0 430 L90 400 L170 420 L260 395 L350 418 L430 398 L512 412 L512 512 L0 512 Z" fill="#2A3558"/>
  <!-- the headlamp's beam -->
  <polygon points="78,92 470,250 330,470" fill="url(#beam)"/>
  <!-- the gem's glow -->
  <circle cx="290" cy="300" r="190" fill="url(#glow)"/>
  <!-- the gem: crown facets on top, pavilion below -->
  <polygon points="190,215 230,165 350,165 390,215" fill="#B98AE8" stroke="#1F2945" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="190,215 390,215 290,400" fill="#9B6BD6" stroke="#1F2945" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="230,165 260,215 290,165" fill="#D9C2F5"/>
  <polygon points="290,165 320,215 350,165" fill="#C9A9EF"/>
  <polygon points="260,215 320,215 290,400" fill="#B98AE8"/>
  <polygon points="190,215 260,215 290,400" fill="#8657C4"/>
  <line x1="190" y1="215" x2="390" y2="215" stroke="#1F2945" stroke-width="6"/>
  <polygon points="190,215 230,165 350,165 390,215 290,400" fill="none" stroke="#1F2945" stroke-width="8" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M400 140 L408 160 L428 168 L408 176 L400 196 L392 176 L372 168 L392 160 Z" fill="#FFF6D6"/>
  <path d="M168 330 L173 343 L186 348 L173 353 L168 366 L163 353 L150 348 L163 343 Z" fill="#FFF6D6"/>
  <!-- Bolt's electric headlamp -->
  <circle cx="78" cy="92" r="52" fill="#3A4A78" stroke="#1F2945" stroke-width="8"/>
  <circle cx="78" cy="92" r="32" fill="#FFE9A8"/>
  <circle cx="70" cy="84" r="10" fill="#FFFFFF"/>
</svg>
